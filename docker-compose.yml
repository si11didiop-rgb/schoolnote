version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolnote_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - schoolnote_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: schoolnote_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - schoolnote_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: schoolnote_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: schoolnote
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: schoolnote
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - schoolnote_network

networks:
  schoolnote_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local